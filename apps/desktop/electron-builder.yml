# electron-builder — installer Windows untuk terminal rig.
# Icon OPSIONAL: bila `build/icon.ico` belum ada, electron-builder memakai icon
# default Electron (build tidak gagal).
appId: com.rigdaily.internal
productName: RigDaily Internal
copyright: PogungSoftwareHouseTeam (PSHT)
# Versi Electron dipin eksplisit karena npm workspaces meletakkan modul
# electron di root node_modules, sehingga electron-builder tidak bisa
# menghitung versinya dari folder apps/desktop.
electronVersion: 31.7.7

directories:
  output: release
  buildResources: build

files:
  - "dist/**"
  - "offline.html"
  - "package.json"
  - "!node_modules/@rigdaily/shared/src/**"
  - "!node_modules/@rigdaily/shared/tsconfig*.json"

# better-sqlite3 adalah modul native: jangan dikemas ke dalam asar, dan WAJIB
# di-rebuild terhadap ABI Electron. `npmRebuild: true` membuat builder me-rebuild
# SETELAH ia menginstall ulang production deps ke staging — rebuild manual
# sebelumnya selalu tertimpa oleh install ulang ini (itulah kenapa binary yang
# terkirim selalu ABI Node 127, bukan ABI Electron 31 = 125).
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

npmRebuild: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "RigDaily-Internal-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: true
  guid: 8a4b2c1d-3e5f-4a6b-8c7d-9e0f1a2b3c4d
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RigDaily Internal
  deleteAppDataOnUninstall: false
  # Installer resmi: halaman lisensi + pilihan komponen standar NSIS.
  # File lisensi diambil dari root repo agar satu sumber dengan LICENSE.md.
  license: ../../LICENSE.md
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Publisher yang tampil di UAC + Programs and Features.
  # Tanpa signing berbayar, Windows tetap menampilkan peringatan SmartScreen
  # "Unknown publisher" — itu wajar untuk rilis internal unsigned.
  artifactName: "RigDaily-Internal-${version}-${arch}.${ext}"

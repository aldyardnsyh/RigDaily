# ============================================================================
# postgres.conf — tuning PostgreSQL 16 untuk VPS 2 vCPU / 2 GB RAM (Lighthouse)
#
# Anggaran: DB boleh memakai ~350–450 MB. Nilai di bawah sengaja konservatif
# karena web (Next.js) juga butuh ~600–700 MB di mesin yang sama.
#
# Dipakai lewat `command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]`
# di docker-compose.prod.yml. Parameter yang TIDAK boleh di set di sini
# (shared_buffers ditentukan total RAM, lihat catatan) dijelaskan per baris.
#
# RUMUS RAM PostgreSQL ≈ shared_buffers + (max_connections * work_mem) + overhead
#   = 192MB + (40 * 4MB) + ~120MB ≈ 470 MB (batas atas saat query paralel gencar).
# ============================================================================

# --- Koneksi ---------------------------------------------------------------
# 40 cukup untuk: web pool (PG_POOL_MAX=10) + migrate/seed + psql admin + margin.
max_connections = 40
# Postgres container tidak butuh superuser_reserved banyak; default 3 aman.
superuser_reserved_connections = 3

# --- Memori ----------------------------------------------------------------
shared_buffers = 192MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 48MB

# --- WAL / checkpoint ------------------------------------------------------
wal_compression = on
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

# --- Planner (SSD/NVMe Lighthouse) ----------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Logging ---------------------------------------------------------------
# Catat hanya query > 1 detik (hemat I/O & ukuran log di disk 40 GB).
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Jakarta'

# --- Timezone --------------------------------------------------------------
timezone = 'Asia/Jakarta'

# --- Keamanan dasar --------------------------------------------------------
# Listen hanya di network internal container (bukan published ke host).
listen_addresses = '*'
password_encryption = scram-sha-256
